# Phase 2 only: review server config before replacing the phase-one snippet.
location = /fighting { return 308 /fighting/; }
location ^~ /fighting/api/v1/ {
    proxy_pass http://127.0.0.1:8780;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_buffering off;
    proxy_read_timeout 75s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
# Keep previous hashed assets so existing recording tabs can still lazy-load workers.
location ^~ /fighting/assets/ {
    alias /var/www/qqsg-fighting/shared/assets/;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
location /fighting/ {
    alias /var/www/qqsg-fighting/current/web/;
    index index.html;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
